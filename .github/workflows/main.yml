name: Build and Publish Jenkins DooD Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"               # Trigger in releases: v2.582, v1.0.0, etc.
      - "[0-9]+.*"         # Trigger in numeric tags: 2.582, 1.0.0, etc.
  pull_request:
    branches:
      - main               # Validate build in PRs, but DO NOT push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: domgiorda/jenkins-dood

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning   # Fails on warnings or worse

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
      packages: write
      security-events: write           # To upload Trivy results to GitHub Security
      id-token: write                  # Required for Sigstore/Cosign keyless OIDC signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # Required for multi-platform

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only logs in if it's not a PR (PRs only build, they don't push)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Jenkins version
        id: jenkins_version
        run: |
          VERSION=$(grep -E '^ARG JENKINS_VERSION=' Dockerfile | cut -d '=' -f2 | tr -d ' "\r\n')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            # In PRs: only the PR number
            type=ref,event=pr

            # In push to main: only <jenkins_version>-edge
            type=raw,value=${{ steps.jenkins_version.outputs.version }}-edge,enable=${{ github.ref == 'refs/heads/main' }}

            # In releases: custom tag + latest
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push only if it's not a PR
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true             # SLSA provenance for supply chain
          sbom: true                   # Generate SBOM attestation

      - name: Sign published Docker image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Scan image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"             # Don't fail the pipeline if there are CRITICAL or HIGH, Only Informational.

      - name: Upload Trivy results to GitHub Security
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif